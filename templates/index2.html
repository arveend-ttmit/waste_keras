<!DOCTYPE html>
<html>
<head><title>Bin Sorter — Live</title></head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background: #111; color: #eee;">
  <h1>Hold the item inside the box</h1>
  <img src="/video_feed" width="640" style="border-radius: 12px;">
  <div id="banner" style="margin: 20px auto; max-width: 640px; padding: 28px;
       border-radius: 12px; background: #444; font-size: 40px; font-weight: 500;">
    Starting...
  </div>
  <div id="stats" style="margin: 12px auto; max-width: 640px;
       font-size: 16px; opacity: 0.8; line-height: 1.6;">
    0 items · ~0.00 kg
  </div>
  
  <script>
    setInterval(() => {
      fetch('/result').then(r => r.json()).then(d => {
        const el = document.getElementById('banner');
        const colours = {
          "BIN 1": "#3B6D11", "BIN 2": "#185FA5", "BIN 3": "#854F0B"
        };
        el.style.background = d.ok ? colours[d.bin] : "#444";
        el.innerHTML = d.ok
          ? `${d.bin}<div style="font-size:18px;opacity:.85;">${d.label} — ${(d.confidence*100).toFixed(0)}%</div>`
          : `${d.label}<div style="font-size:18px;opacity:.85;">${(d.confidence*100).toFixed(0)}%</div>`;
      });
      fetch('/session').then(r => r.json()).then(s => {
        document.getElementById('stats').innerHTML =
          `${s.total_items} items · ~${(s.est_weight_g / 1000).toFixed(2)} kg` +
          Object.entries(s.counts).map(([b, n]) => `<br>${b}: ${n}`).join('');
      });
    }, 400);
  </script>
</body>
</html>
